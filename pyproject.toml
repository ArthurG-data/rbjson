[project]
name = "rbjson"
version = "0.4.0"
description = "An open dataset of Riftbound sets, cards and printings"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.uv]
package = false
